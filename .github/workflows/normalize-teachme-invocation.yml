name: Finalize TeachMe Invocation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/normalize-teachme-invocation.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh Codex and Claude mirrors
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main

          rm -rf .agents/skills/teachme .claude/skills/teachme
          mkdir -p .agents/skills/teachme .claude/skills/teachme
          cp -a skills/teachme/. .agents/skills/teachme/
          cp -a skills/teachme/. .claude/skills/teachme/

          if [[ -z "$(git status --porcelain -- .agents/skills .claude/skills)" ]]; then
            echo 'Skill mirrors are already current.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A -- .agents/skills .claude/skills
            git commit -m 'Sync intuitive TeachMe invocation to agent mirrors'

            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                break
              fi
              git pull --rebase origin main
              if [[ "$attempt" == 3 ]]; then
                exit 1
              fi
            done
          fi

      - name: Publish updated wiki
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          WIKI_DIR="$RUNNER_TEMP/rung-teaching-wiki"
          rm -rf "$WIKI_DIR"
          git clone \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" \
            "$WIKI_DIR"

          rsync -a --delete --exclude '.git/' wiki/ "$WIKI_DIR/"

          cd "$WIKI_DIR"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A

          if git diff --cached --quiet; then
            echo 'Wiki is already current.'
            exit 0
          fi

          git commit -m 'Publish intuitive TeachMe invocation syntax'
          git push origin HEAD
