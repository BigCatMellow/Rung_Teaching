name: Sync TeachMe Skills

on:
  push:
    branches: [main]
    paths:
      - 'skills/teachme/**'
      - '.github/workflows/sync-rung-skills.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-teachme-skills
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Mirror canonical skill
        shell: bash
        run: |
          set -euo pipefail

          # Remove the former generated skill name.
          rm -rf .agents/skills/rung-teaching .claude/skills/rung-teaching

          for target in .agents/skills/teachme .claude/skills/teachme; do
            rm -rf "$target"
            mkdir -p "$target"
            cp -a skills/teachme/. "$target/"
          done

      - name: Commit mirrors when changed
        shell: bash
        run: |
          set -euo pipefail

          # Stage from the parent skill directories so deleted legacy paths are
          # included without passing nonexistent paths directly to git add.
          PATHS=(.agents/skills .claude/skills)

          if [[ -z "$(git status --porcelain -- "${PATHS[@]}")" ]]; then
            echo "Skill mirrors are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- "${PATHS[@]}"
          git commit -m "Sync TeachMe skill mirrors"

          # main may receive documentation commits while this workflow runs.
          # Rebase and retry so generated mirrors do not fail on a harmless
          # non-fast-forward push. A newer skill-triggered run cancels this one.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push attempt ${attempt} failed; rebasing onto current main."
            git pull --rebase origin main
          done

          echo "Unable to push TeachMe mirrors after retries."
          exit 1
